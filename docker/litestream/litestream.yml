# Replica continua del database verso uno storage S3-compatibile (Cloudflare R2,
# Backblaze B2, ...). Litestream legge il WAL e spedisce le modifiche a pochi
# secondi di distanza: se il server sparisce, si perde al massimo l'ultimo
# minuto, non tutto quello che c'e' stato dall'ultimo deploy.
#
# I ${...} vengono espansi da Litestream all'avvio, dalle variabili del .env.
#
# Ripristino (su una macchina qualsiasi, col .env compilato):
#
#   docker run --rm --env-file .env -v "$PWD/restore:/data" \
#     -v "$PWD/docker/litestream/litestream.yml:/etc/litestream.yml:ro" \
#     litestream/litestream:0.3.13 restore /data/funeral.db
dbs:
  - path: /data/funeral.db
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: funeral-docs
        endpoint: ${LITESTREAM_ENDPOINT}
        region: auto
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
        # Uno snapshot completo al giorno, e quelli piu' vecchi di 30 giorni si
        # cancellano: si puo' tornare a qualsiasi momento dell'ultimo mese.
        snapshot-interval: 24h
        retention: 720h
